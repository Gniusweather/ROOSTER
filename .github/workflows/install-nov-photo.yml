name: Install November Photo

on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/novb64/**
      - .github/scripts/run-nov-parts.py
      - .github/workflows/install-nov-photo.yml

jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble photo and wire app
        run: python3 .github/scripts/run-nov-parts.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add november-2026.jpg index.html sw.js
          git diff --cached --quiet || git commit -m "Add November 2026 original roster photo to November tab"
          git push
