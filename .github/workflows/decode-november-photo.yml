name: Decode November Photo

on:
  workflow_dispatch: {}
  push:
    paths:
      - november-2026.jpg.b64
      - .github/scripts/decode-november-photo.py
      - .github/workflows/decode-november-photo.yml

jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode photo and wire BUILTIN
        run: python3 .github/scripts/decode-november-photo.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add november-2026.jpg index.html sw.js
          git diff --cached --quiet || git commit -m "Add November 2026 original roster photo"
          git push
