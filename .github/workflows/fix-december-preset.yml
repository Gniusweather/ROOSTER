name: Fix December PRESET

on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/scripts/fix-december-preset.py
      - .github/workflows/fix-december-preset.yml

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fix-december-preset.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Fix December: inject full roster into PRESET (OT base 115u)"
          git push
