name: Open on current month

on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/scripts/patch-open-current-month.py
      - .github/workflows/patch-open-current-month.yml

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply open-current-month patch
        run: python3 .github/scripts/patch-open-current-month.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Open app on current calendar month and scroll that tab into view"
          git push
