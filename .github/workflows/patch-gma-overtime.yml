name: Patch GMA overtime

on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/scripts/patch-gma-overtime.py
      - .github/workflows/patch-gma-overtime.yml

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/patch-gma-overtime.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "GMA person card: show overtime (Oct 72 / Nov 115 / else 144)"
          git push
