name: Install November URI photo

on:
  workflow_dispatch: {}

jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/run-nov-uri.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Show November original roster photo like October"
          git push
