name: Patch November 2026

on:
  workflow_dispatch: {}
  push:
    paths:
      - november-2026.json
      - .github/scripts/inject-november.py
      - .github/scripts/fix-november-builtin.py
      - .github/workflows/patch-november.yml

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Inject November into index.html
        run: python3 .github/scripts/inject-november.py

      - name: Drop missing November photo reference
        run: python3 .github/scripts/fix-november-builtin.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Add November 2026 roster to app preset"
          git push
