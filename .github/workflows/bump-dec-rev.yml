name: Bump Dec PRESET_REV
on:
  push:
    paths: ['.github/scripts/bump-dec-rev.py']
  workflow_dispatch: {}
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/bump-dec-rev.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "December PRESET_REV 2 + SW v21"
          git push
