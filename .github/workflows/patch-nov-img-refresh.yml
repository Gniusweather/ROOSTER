name: Refresh November photo clients

on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/scripts/patch-nov-img-refresh.py
      - .github/workflows/patch-nov-img-refresh.yml

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/patch-nov-img-refresh.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Clear stale November local photo; cache-bust builtin image"
          git push
