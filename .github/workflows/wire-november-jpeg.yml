name: Wire November JPEG

on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/scripts/wire-november-jpeg.py
      - .github/workflows/wire-november-jpeg.yml
      - november-2026.jpeg

jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wire BUILTIN + SW
        run: python3 .github/scripts/wire-november-jpeg.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Show November original roster photo like October"
          git push
