name: Patch Nov GMA OT 16

on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/scripts/patch-nov-ot16.py
      - .github/workflows/patch-nov-ot16.yml

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/patch-nov-ot16.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "November GMA person card: fixed +16u overtime"
          git push
